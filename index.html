<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Christmas Lily</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="snow-canvas" aria-hidden="true"></canvas>

  <main class="stage">
    <!-- Shared SVG Gradients for Shaded Hearts -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <radialGradient id="grad-h1" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff7aa8" />
          <stop offset="65%" stop-color="#ec4882" />
          <stop offset="100%" stop-color="#b82559" />
        </radialGradient>

        <radialGradient id="grad-h2" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#e32658" />
          <stop offset="65%" stop-color="#b50b38" />
          <stop offset="100%" stop-color="#780422" />
        </radialGradient>

        <radialGradient id="grad-h3" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff7ba7" />
          <stop offset="65%" stop-color="#f24982" />
          <stop offset="100%" stop-color="#bd2458" />
        </radialGradient>

        <radialGradient id="grad-h4" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff8082" />
          <stop offset="65%" stop-color="#f54e52" />
          <stop offset="100%" stop-color="#bd2629" />
        </radialGradient>

        <radialGradient id="grad-h5" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff9ec7" />
          <stop offset="65%" stop-color="#f76da6" />
          <stop offset="100%" stop-color="#c43b74" />
        </radialGradient>

        <radialGradient id="grad-h6" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff3333" />
          <stop offset="65%" stop-color="#cc0404" />
          <stop offset="100%" stop-color="#850000" />
        </radialGradient>
      </defs>
    </svg>

    <!-- 6 Radial Hearts -->
    <svg class="heart h1" viewBox="0 0 120 110" aria-hidden="true">
      <path d="M60 100 C60 100 10 68 10 34 C10 15 26 6 42 12 C51 15 57 23 60 30 C63 23 69 15 78 12 C94 6 110 15 110 34 C110 68 60 100 60 100 Z" />
    </svg>

    <svg class="heart h2" viewBox="0 0 120 110" aria-hidden="true">
      <path d="M60 100 C60 100 10 68 10 34 C10 15 26 6 42 12 C51 15 57 23 60 30 C63 23 69 15 78 12 C94 6 110 15 110 34 C110 68 60 100 60 100 Z" />
    </svg>

    <svg class="heart h3" viewBox="0 0 120 110" aria-hidden="true">
      <path d="M60 100 C60 100 10 68 10 34 C10 15 26 6 42 12 C51 15 57 23 60 30 C63 23 69 15 78 12 C94 6 110 15 110 34 C110 68 60 100 60 100 Z" />
    </svg>

    <svg class="heart h4" viewBox="0 0 120 110" aria-hidden="true">
      <path d="M60 100 C60 100 10 68 10 34 C10 15 26 6 42 12 C51 15 57 23 60 30 C63 23 69 15 78 12 C94 6 110 15 110 34 C110 68 60 100 60 100 Z" />
    </svg>

    <svg class="heart h5" viewBox="0 0 120 110" aria-hidden="true">
      <path d="M60 100 C60 100 10 68 10 34 C10 15 26 6 42 12 C51 15 57 23 60 30 C63 23 69 15 78 12 C94 6 110 15 110 34 C110 68 60 100 60 100 Z" />
    </svg>

    <svg class="heart h6" viewBox="0 0 120 110" aria-hidden="true">
      <path d="M60 100 C60 100 10 68 10 34 C10 15 26 6 42 12 C51 15 57 23 60 30 C63 23 69 15 78 12 C94 6 110 15 110 34 C110 68 60 100 60 100 Z" />
    </svg>

    <h1 class="center-message">
      <span>Merry Christmas</span>
      <span>To My Beloved</span>
      <span>Lily</span>
    </h1>
  </main>

  <script>
    const canvas = document.getElementById("snow-canvas");
    const ctx = canvas.getContext("2d");
    let width, height, flakes;

    function initSnow() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      const count = Math.min(Math.floor((width * height) / 9000), 140);

      flakes = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 3.2 + 1.2,
        speedY: (Math.random() * 1.1 + 0.45) * 0.5,
        drift: Math.random() * Math.PI * 2,
        driftSpeed: (Math.random() * 0.015 + 0.005) * 0.5,
        opacity: Math.random() * 0.5 + 0.45
      }));
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);

      for (const f of flakes) {
        f.y += f.speedY;
        f.drift += f.driftSpeed;
        f.x += Math.sin(f.drift) * 0.35;

        if (f.y > height + 10) {
          f.y = -10;
          f.x = Math.random() * width;
        }
        if (f.x > width + 10) f.x = -10;
        if (f.x < -10) f.x = width + 10;

        // Soft shaded snowflake with subtle rose-silver edge so it shows up on white/pink
        const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        grad.addColorStop(0, `rgba(255, 255, 255, ${f.opacity})`);
        grad.addColorStop(0.65, `rgba(255, 244, 248, ${f.opacity * 0.85})`);
        grad.addColorStop(1, "rgba(215, 165, 185, 0)");

        ctx.beginPath();
        ctx.fillStyle = grad;
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(drawSnow);
    }

    window.addEventListener("resize", initSnow);
    initSnow();
    drawSnow();
  </script>
</body>
</html>
