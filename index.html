<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Christmas Lily</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="snow-canvas" aria-hidden="true"></canvas>

  <!-- Shared SVG Gradients & Reusable Heart Symbol -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="heart-shape" viewBox="0 0 120 110">
        <path d="M60 100 C60 100 10 68 10 34 C10 15 26 6 42 12 C51 15 57 23 60 30 C63 23 69 15 78 12 C94 6 110 15 110 34 C110 68 60 100 60 100 Z" />
      </symbol>

      <radialGradient id="grad-h1" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ff7aa8" />
        <stop offset="65%" stop-color="#ec4882" />
        <stop offset="100%" stop-color="#b82559" />
      </radialGradient>

      <radialGradient id="grad-h2" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#e32658" />
        <stop offset="65%" stop-color="#b50b38" />
        <stop offset="100%" stop-color="#780422" />
      </radialGradient>

      <radialGradient id="grad-h3" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ff7ba7" />
        <stop offset="65%" stop-color="#f24982" />
        <stop offset="100%" stop-color="#bd2458" />
      </radialGradient>

      <radialGradient id="grad-h4" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ff8082" />
        <stop offset="65%" stop-color="#f54e52" />
        <stop offset="100%" stop-color="#bd2629" />
      </radialGradient>

      <radialGradient id="grad-h5" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ff9ec7" />
        <stop offset="65%" stop-color="#f76da6" />
        <stop offset="100%" stop-color="#c43b74" />
      </radialGradient>

      <radialGradient id="grad-h6" cx="35%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#ff3333" />
        <stop offset="65%" stop-color="#cc0404" />
        <stop offset="100%" stop-color="#850000" />
      </radialGradient>
    </defs>
  </svg>

  <!-- Interactive Present Intro Screen -->
  <section id="present-screen" class="present-screen" aria-label="Christmas Gift">
    <div class="gift-container" id="gift-box" role="button" tabindex="0" aria-label="Tap gift to open">
      <div class="gift-glow" aria-hidden="true"></div>
      <div class="gift-visual" id="gift-visual">
        <div class="gift-lid" id="gift-lid">
          <div class="gift-bow">
            <span class="bow-loop left"></span>
            <span class="bow-loop right"></span>
            <span class="bow-knot"></span>
          </div>
          <div class="lid-ribbon"></div>
        </div>
        <div class="gift-box-body">
          <div class="box-ribbon-v"></div>
          <div class="box-ribbon-h"></div>
        </div>
      </div>
      <div class="gift-shadow" aria-hidden="true"></div>
    </div>

    <p class="gift-prompt" id="gift-prompt">Tap to unwrap your gift</p>
    <div class="tap-dots" id="tap-dots" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </section>

  <!-- Main Reveal Stage -->
  <main class="stage stage-hidden" id="main-stage">
    <!-- 6 Radial Hearts -->
    <svg class="heart h1" aria-hidden="true"><use href="#heart-shape" /></svg>
    <svg class="heart h2" aria-hidden="true"><use href="#heart-shape" /></svg>
    <svg class="heart h3" aria-hidden="true"><use href="#heart-shape" /></svg>
    <svg class="heart h4" aria-hidden="true"><use href="#heart-shape" /></svg>
    <svg class="heart h5" aria-hidden="true"><use href="#heart-shape" /></svg>
    <svg class="heart h6" aria-hidden="true"><use href="#heart-shape" /></svg>

    <div class="message-wrapper">
      <h1 class="center-message">
        <span class="line-1">Merry Christmas</span>
        <span class="line-2">To My Beloved</span>
        <span class="line-3">Lily</span>
      </h1>
    </div>
  </main>

  <script>
    /* =========================================
       1. Cozy Fireplace + Holiday Chimes (Web Audio)
       ========================================= */
    let audioCtx = null;
    let fireplaceStarted = false;
    let chimeTimer = null;

    const chimeNotes = [
      { freq: 392.00, dur: 0.75 }, // G4
      { freq: 440.00, dur: 0.45 }, // A4
      { freq: 392.00, dur: 0.90 }, // G4
      { freq: 329.63, dur: 1.15 }, // E4
      { freq: 392.00, dur: 0.75 }, // G4
      { freq: 440.00, dur: 0.45 }, // A4
      { freq: 392.00, dur: 0.90 }, // G4
      { freq: 329.63, dur: 1.15 }, // E4
      { freq: 587.33, dur: 0.95 }, // D5
      { freq: 587.33, dur: 0.55 }, // D5
      { freq: 493.88, dur: 1.15 }, // B4
      { freq: 523.25, dur: 0.95 }, // C5
      { freq: 523.25, dur: 0.55 }, // C5
      { freq: 392.00, dur: 1.25 }  // G4
    ];

    function playSoftChime(freq, duration) {
      if (!audioCtx || audioCtx.state !== "running") return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const overtone = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const overtoneGain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now);

      overtone.type = "triangle";
      overtone.frequency.setValueAtTime(freq * 2, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.045, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      overtoneGain.gain.setValueAtTime(0.0001, now);
      overtoneGain.gain.exponentialRampToValueAtTime(0.012, now + 0.02);
      overtoneGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.6);

      osc.connect(gain);
      overtone.connect(overtoneGain);
      gain.connect(audioCtx.destination);
      overtoneGain.connect(audioCtx.destination);

      osc.start(now);
      overtone.start(now);
      osc.stop(now + duration + 0.05);
      overtone.stop(now + duration + 0.05);
    }

    function startHolidayChimes() {
      if (chimeTimer) return;
      let index = 0;

      function stepNote() {
        const note = chimeNotes[index % chimeNotes.length];
        playSoftChime(note.freq, note.dur);
        index++;
        chimeTimer = setTimeout(stepNote, (note.dur + 0.22) * 1000);
      }

      stepNote();
    }

    function startCozyFireplace() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      if (fireplaceStarted) return;
      fireplaceStarted = true;

      const sampleRate = audioCtx.sampleRate;
      const length = sampleRate * 4;
      const buffer = audioCtx.createBuffer(1, length, sampleRate);
      const data = buffer.getChannelData(0);

      let lastOut = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        lastOut = (lastOut + 0.03 * white) / 1.03;
        let sample = lastOut * 1.4;

        if (Math.random() < 0.00075) {
          sample += (Math.random() * 2 - 1) * 0.45;
        }
        data[i] = Math.max(-1, Math.min(1, sample));
      }

      const noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = buffer;
      noiseSource.loop = true;
      noiseSource.playbackRate.setValueAtTime(1.875, audioCtx.currentTime); // 1.25 * 1.5

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.setValueAtTime(520, audioCtx.currentTime);

      const fireGain = audioCtx.createGain();
      fireGain.gain.setValueAtTime(0.1512, audioCtx.currentTime); // 0.168 * 0.9

      noiseSource.connect(lowpass);
      lowpass.connect(fireGain);
      fireGain.connect(audioCtx.destination);
      noiseSource.start();

      setTimeout(startHolidayChimes, 400);
    }

    /* =========================================
       2. Snow Canvas (Preserves Flakes on Resize)
       ========================================= */
    const canvas = document.getElementById("snow-canvas");
    const ctx = canvas.getContext("2d");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let width = 0;
    let height = 0;
    let flakes = [];

    const snowPalette = [
      { core: [255, 255, 255], edge: [156, 163, 175] },
      { core: [209, 213, 219], edge: [107, 114, 128] },
      { core: [244, 114, 182], edge: [190, 24, 93] },
      { core: [255, 228, 238], edge: [219, 39, 119] }
    ];

    function createFlake(index, w, h, randomY = true) {
      const tint = snowPalette[index % snowPalette.length];
      return {
        x: Math.random() * w,
        y: randomY ? Math.random() * h : -10,
        r: Math.random() * 3.4 + 1.6,
        speedY: (Math.random() * 1.1 + 0.45) * 0.5,
        drift: Math.random() * Math.PI * 2,
        driftSpeed: (Math.random() * 0.015 + 0.005) * 0.5,
        opacity: Math.random() * 0.35 + 0.55,
        tint
      };
    }

    function resizeSnow() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      const targetCount = Math.min(Math.floor((width * height) / 9000), 140);

      for (const f of flakes) {
        if (f.x > width) f.x = Math.random() * width;
        if (f.y > height) f.y = Math.random() * height;
      }

      if (flakes.length < targetCount) {
        for (let i = flakes.length; i < targetCount; i++) {
          flakes.push(createFlake(i, width, height, true));
        }
      } else if (flakes.length > targetCount) {
        flakes.length = targetCount;
      }
    }

    function drawSnow() {
      ctx.clearRect(0, 0, width, height);

      for (const f of flakes) {
        if (!prefersReducedMotion) {
          f.y += f.speedY;
          f.drift += f.driftSpeed;
          f.x += Math.sin(f.drift) * 0.35;
        }

        if (f.y > height + 10) {
          f.y = -10;
          f.x = Math.random() * width;
        }
        if (f.x > width + 10) f.x = -10;
        if (f.x < -10) f.x = width + 10;

        const [cr, cg, cb] = f.tint.core;
        const [er, eg, eb] = f.tint.edge;

        const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
        grad.addColorStop(0, `rgba(${cr}, ${cg}, ${cb}, ${f.opacity})`);
        grad.addColorStop(0.7, `rgba(${er}, ${eg}, ${eb}, ${f.opacity * 0.65})`);
        grad.addColorStop(1, `rgba(${er}, ${eg}, ${eb}, 0)`);

        ctx.beginPath();
        ctx.fillStyle = grad;
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (!prefersReducedMotion) {
        requestAnimationFrame(drawSnow);
      }
    }

    window.addEventListener("resize", () => {
      resizeSnow();
      if (prefersReducedMotion) drawSnow();
    });
    resizeSnow();
    drawSnow();

    /* =========================================
       3. Present Unwrap Logic
       ========================================= */
    const presentScreen = document.getElementById("present-screen");
    const giftBox = document.getElementById("gift-box");
    const giftVisual = document.getElementById("gift-visual");
    const giftPrompt = document.getElementById("gift-prompt");
    const tapDotsWrap = document.getElementById("tap-dots");
    const dots = document.querySelectorAll("#tap-dots .dot");
    const mainStage = document.getElementById("main-stage");

    const REQUIRED_TAPS = 5;
    let taps = 0;
    let isOpened = false;

    const messages = [
      "Tap to unwrap your gift",
      "Keep tapping...",
      "The ribbon is loosening!",
      "Almost open...",
      "One more tap!"
    ];

    function spawnMiniHearts(x, y, count) {
      if (prefersReducedMotion) return;
      const colors = ["#ff7aa8", "#e32658", "#ff3333", "#f76da6"];
      for (let i = 0; i < count; i++) {
        const heart = document.createElement("span");
        heart.className = "burst-heart";
        heart.textContent = "♥";
        heart.style.left = `${x}px`;
        heart.style.top = `${y}px`;
        heart.style.color = colors[i % colors.length];

        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const distance = 65 + Math.random() * 95;
        heart.style.setProperty("--tx", `${Math.cos(angle) * distance}px`);
        heart.style.setProperty("--ty", `${Math.sin(angle) * distance - 35}px`);
        heart.style.setProperty("--rot", `${(Math.random() - 0.5) * 65}deg`);

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 900);
      }
    }

    function handleGiftClick(e) {
      if (isOpened) return;

      startCozyFireplace();

      taps++;
      const rect = giftBox.getBoundingClientRect();
      const clickX = e.clientX || rect.left + rect.width / 2;
      const clickY = e.clientY || rect.top + rect.height / 2;

      if (dots[taps - 1]) {
        dots[taps - 1].classList.add("active");
      }

      giftVisual.classList.remove("shake-1", "shake-2", "shake-3", "shake-4");
      void giftVisual.offsetWidth;

      if (taps < REQUIRED_TAPS) {
        giftVisual.classList.add(`shake-${taps}`);
        giftPrompt.textContent = messages[taps];
        spawnMiniHearts(clickX, clickY, 4 + taps);

        if (taps >= 3) {
          giftBox.classList.add("bow-loose");
        }
        if (taps >= 4) {
          giftBox.classList.add("lid-peek");
        }
      } else {
        isOpened = true;
        giftPrompt.style.opacity = "0";
        tapDotsWrap.style.opacity = "0";

        giftBox.classList.add("opened");
        spawnMiniHearts(rect.left + rect.width / 2, rect.top + rect.height / 2, 28);

        setTimeout(() => {
          presentScreen.classList.add("fade-out");
          mainStage.classList.remove("stage-hidden");
          mainStage.classList.add("stage-revealed");
        }, 550);
      }
    }

    giftBox.addEventListener("click", handleGiftClick);
    giftBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handleGiftClick(e);
      }
    });
  </script>
</body>
</html>
